<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <title>⏱️ טיימר משימות</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial, sans-serif; direction: rtl; background:#fafafa; }
    h1 { text-align:center; }
    table { width: 100%; border-collapse: collapse; margin-top:15px; background:white; }
    th, td { border: 1px solid #999; padding: 6px; text-align: center; }
    input[type="number"] { width: 64px; }
    input[type="text"] { width: 180px; }
    .muted { color: #777; font-size: 12px; }
    .badge { display:inline-block; padding:2px 6px; border-radius:6px; font-size:12px;}
    .running { background:#d9ffd9; transition: background-color 0.4s ease; }
    .paused  { background:#fff0b3; transition: background-color 0.4s ease; }
    .pending { background:#f2f2f2; transition: background-color 0.4s ease; }
    .done    { background:#e6e6e6; color:#666; text-decoration: line-through; transition: background-color 0.4s ease; }
    button { cursor:pointer; }
    .row-actions { display:flex; gap:4px; flex-wrap:wrap; justify-content:center; }
    .edit-grid, .extend-grid, .move-grid {
      display:flex; gap:6px; align-items:center; justify-content:center; flex-wrap:wrap;
    }
    tr { transition: background-color 0.4s ease; }
    .toolbar { text-align:center; margin-bottom:10px; line-height:1.8 }
    .tools { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:10px }
    .work-col { width: 42px; }
    .sim-row { background:#f9f9ff; font-size:12px; color:#444; }
    .sim-label { font-weight:bold; }

    /* 🆕 תצוגת חריגה */
    #overrun { display:inline-block; margin-top:4px; padding:4px 12px; border-radius:8px; font-weight:bold; font-size:18px; }
    #overrun.over  { background:#ffd6d6; color:#b00020; }
    #overrun.ahead { background:#d9ffd9; color:#1b7a2b; }
    #overrun.ontime{ background:#eef; color:#334; }

    /* 🆕 זמנים מהירים + הפסקה */
    .presets { margin-inline-start:8px; }
    .preset { border:1px solid #bbb; background:#fff; border-radius:6px; padding:2px 8px; }
    .preset.active { background:#3498db; color:#fff; border-color:#3498db; }

    /* 🆕 פריסה: תוכן + פאנל מטלות קבועות בצד */
    .layout { display:flex; gap:12px; align-items:flex-start; }
    .main { flex:1; min-width:0; }
    .side { width:230px; flex-shrink:0; position:sticky; top:10px;
            background:#eaf4ff; border:1px solid #b9d8f5; border-radius:10px; padding:10px; }
    .side h3 { margin:0 0 8px; font-size:16px; text-align:center; }
    .fixed-item { background:#fff; border:1px solid #d3e4f5; border-radius:8px; padding:8px; margin-bottom:8px; }
    .fixed-item .title { font-weight:bold; }
    .fixed-item .dur { color:#555; font-size:13px; }
    .fixed-item .row { display:flex; gap:6px; align-items:center; margin-top:6px; }
    .fixed-item input { width:60px; }
    .side .hint { font-size:12px; color:#666; text-align:center; }
    @media (max-width: 900px) {
      .layout { flex-direction:column; }
      .side { width:auto; position:static; }
    }

    /* 🆕 זמן ספייר */
    .spare { background:#fff; border:2px solid #9fc5ea; border-radius:10px; padding:10px; margin-bottom:12px; text-align:center; }
    .spare.active { border-color:#e08a00; background:#fff7e6; }
    .spare.over   { border-color:#c62828; background:#ffe3e3; }
    .spare .title { font-weight:bold; font-size:15px; }
    #spareClock { font-size:26px; font-weight:bold; font-variant-numeric:tabular-nums; margin:4px 0; }
    .spare.over #spareClock { color:#c62828; }
    #spareBtn { width:100%; padding:7px; border:none; border-radius:6px; color:#fff; background:#e08a00; font-weight:bold; }
    .spare.active #spareBtn { background:#2e7d32; }
    #spareBtn:disabled { background:#bbb; cursor:default; }
    .spare .row { display:flex; gap:6px; align-items:center; justify-content:center; margin-top:8px; font-size:13px; }
    .spare .row input { width:55px; }
    #spareInfo { font-size:12px; color:#555; margin-top:6px; }
    .linklike { background:none; border:none; color:#1565c0; text-decoration:underline; padding:0; font-size:12px; }
  </style>
</head>
<body>

<h1>⏱️ טיימר משימות</h1>

<div class="toolbar">
  <div id="now" class="muted"></div>
  <b>שעת סיום מתוכננת:</b> <span id="plannedEnd">-</span>
  <button id="btnResetPlan" title="קובע את שעת הסיום הצפויה כרגע כיעד החדש">קבע יעד מחדש</button><br>
  <b>שעת סיום צפויה:</b> <span id="overallEnd">-</span><br>
  <span id="overrun"></span><br>
  <b>זמן עבודה כולל:</b> <span id="workTotal">00:00:00</span>
</div>

<div class="layout">
<aside class="side">
  <div class="spare" id="spareBox">
    <div class="title">⏳ זמן ספייר</div>
    <div id="spareClock">00:00:00</div>
    <button id="spareBtn">▶ הפעל ספייר</button>
    <div class="row">
      <input id="spareMin" type="number" min="0" placeholder="דק'"> דקות
      <button id="spareSave">שמור</button>
    </div>
    <div id="spareInfo"></div>
  </div>

  <h3>📌 מטלות קבועות</h3>
  <div id="fixedList"></div>
  <div class="hint">מיקום ריק = בסוף הרשימה</div>
</aside>

<div class="main">
<div class="tools">
  <span>
    <input id="newName" type="text" placeholder="שם משימה">
    <input id="newH" type="number" min="0" value="0"> שעות
    <input id="newM" type="number" min="0" value="0"> דקות
    <input id="newS" type="number" min="0" value="0"> שניות
    <input id="newPos" type="number" min="1" value="1" style="width:60px" title="מיקום משימה חדשה">
    <button id="btnAdd">➕ הוסף</button>
    <span class="presets">
      זמן מהיר:
      <button type="button" class="preset" data-min="10">10 דק'</button>
      <button type="button" class="preset" data-min="15">15 דק'</button>
      <button type="button" class="preset" data-min="30">30 דק'</button>
    </span>
  </span>

  <span>
    שעת התחלה לסימולציה:
    <input id="simStartTime" type="time">
    <button id="btnSimToggle">הסתר סימולציה</button>
  </span>

  <span>
    <button id="btnAllPending">הפוך את כל המשימות ל-Pending</button>
  </span>

  <span>
    <button id="btnExport">📤 ייצא</button>
    <label style="cursor:pointer">
      📥 ייבא
      <input id="fileImport" type="file" accept="application/json" style="display:none">
    </label>
  </span>
</div>

<table>
  <thead>
    <tr>
      <th>#</th>
      <th class="work-col">עבודה</th>
      <th>שם</th>
      <th>נותר</th>
      <th>שעת התחלה</th>
      <th>שעת סיום</th>
      <th>סטטוס</th>
      <th>עריכה</th>
      <th>הארכה</th>
      <th>העברה</th>
      <th>פעולות</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>
</div>
</div>

<script>
const $ = s => document.querySelector(s);
let tasks = [];
let syncing = false;
let lastServerSync = 0;
let frozenLayout = null;
let showSimulation = true;
let blockSync = false;
let isTyping = false;
let simUserValue = null;

// 🆕 נתוני יעד/חריגה מהשרת
let serverOffset = 0;   // הפרש שעון בין השרת לדפדפן
let plan = { planned:null, projected:null, live:false, sumRemaining:0 };
const nowMs = () => Date.now() + serverOffset;

(function initSimTime(){
  const saved = localStorage.getItem("simStartTime");
  const input = $("#simStartTime");
  if (saved) {
    input.value = saved;
    simUserValue = saved;
  } else {
    simUserValue = input.value || "08:00";
    input.value = simUserValue;
  }
})();

const tzFmt = new Intl.DateTimeFormat("he-IL", {
  timeZone: "Asia/Jerusalem",
  hour12: false,
  hour: "2-digit", minute: "2-digit", second: "2-digit"
});

function fmt(t){
  t = Math.max(0, parseInt(t));
  let h = Math.floor(t/3600),
      m = Math.floor((t%3600)/60),
      s = t%60;
  return `${h.toString().padStart(2,"0")}:${m.toString().padStart(2,"0")}:${s.toString().padStart(2,"0")}`;
}

function badgeClass(st){
  if(st==="running") return "badge running";
  if(st==="paused")  return "badge paused";
  if(st==="pending") return "badge pending";
  return "badge done";
}

async function api(url, method="GET", body=null){
  try{
    const res = await fetch(url,{
      method,
      headers:{ "Content-Type":"application/json" },
      body: body ? JSON.stringify(body) : null
    });
    return await res.json();
  } catch { return null; }
}

// ---- 🆕 שעת סיום צפויה + חריגה ----
function projectedMs(){
  // בהשהיה (אין משימה רצה) – הסיום הצפוי זז קדימה עם כל שנייה
  if (plan.live) return nowMs() + (plan.sumRemaining + spareCalc().left) * 1000;
  return plan.projected;
}

function updateEndInfo(){
  const proj = projectedMs();
  $("#overallEnd").textContent = proj ? tzFmt.format(new Date(proj)) : "-";
  $("#plannedEnd").textContent = plan.planned
    ? tzFmt.format(new Date(plan.planned))
    : "ייקבע בלחיצה על התחל";

  const box = $("#overrun");
  if (!plan.planned || !proj){ box.textContent = ""; box.className = ""; return; }

  const diff = Math.round((proj - plan.planned) / 1000);
  if (diff > 0){
    box.className = "over";
    box.textContent = `⚠️ חריגה: ${fmt(diff)}`;
  } else if (diff < 0){
    box.className = "ahead";
    box.textContent = `✅ מקדים ב־${fmt(-diff)}`;
  } else {
    box.className = "ontime";
    box.textContent = "בדיוק בזמן";
  }
}

function computeTimesOnce(){
  const nowMsV = Date.now();
  const r = tasks.findIndex(t => t.status === "running");
  let layout = [];

  if (r === -1){
    let base = nowMsV;
    for (const t of tasks){
      const dur = t.remaining * 1000;
      layout.push({id:t.id, start:base, end:base+dur});
      base += dur;
    }
  } else {
    const run = tasks[r];
    const elapsed = run.duration - run.remaining;
    const startRun = nowMsV - elapsed * 1000;
    const endRun   = startRun + run.duration * 1000;

    let end = startRun;
    for (let i = r-1; i >= 0; i--){
      const dur = tasks[i].remaining * 1000;
      layout.unshift({id:tasks[i].id, start:end-dur, end:end});
      end -= dur;
    }

    layout.push({id:run.id, start:startRun, end:endRun});

    let base = endRun;
    for (let i = r+1; i < tasks.length; i++){
      const dur = tasks[i].remaining * 1000;
      layout.push({id:tasks[i].id, start:base, end:base+dur});
      base += dur;
    }
  }

  frozenLayout = layout;
}

function computeSimulationLayout(){
  const [hh,mm] = simUserValue.split(":").map(x=>parseInt(x)||0);
  const nowDate = new Date();
  const simStart = new Date(nowDate.getFullYear(),nowDate.getMonth(),nowDate.getDate(),hh,mm,0).getTime();

  let layout = [];
  let base = simStart;

  for(const t of tasks){
    const dur = t.duration * 1000;
    layout.push({id:t.id, start:base, end:base+dur});
    base += dur;
  }
  return layout;
}

// ---- סנכרון ----
async function syncState(force=false){
  if(syncing || blockSync) return;
  const now = Date.now();
  if(!force && now - lastServerSync < 2000) return;

  syncing = true;
  const data = await api("/state");
  syncing = false;
  lastServerSync = now;

  if(!data || !data.ok) return;

  tasks = data.tasks;
  $("#workTotal").textContent = data.work_total_hhmmss;
  $("#now").textContent = data.now;

  // 🆕
  serverOffset = data.server_now_ms - Date.now();
  plan = {
    planned: data.planned_end_ms,
    projected: data.projected_end_ms,
    live: data.projected_is_live,
    sumRemaining: tasks
      .filter(t => ["running","paused","pending"].includes(t.status))
      .reduce((a,t) => a + t.remaining, 0)
  };
  updateEndInfo();

  spare = {
    budget: data.spare_budget_seconds || 0,
    used: data.spare_used_seconds || 0,
    active: !!data.spare_active,
    startMs: data.spare_start_ms
  };
  if (document.activeElement !== $("#spareMin"))
    $("#spareMin").value = spare.budget ? Math.round(spare.budget/60) : "";
  updateSpare();

  if (!tasks.some(t => t.status === "running"))
    frozenLayout = null;

  renderTasks();
}

function renderTasks(){
  if (isTyping) return;

  const tb = $("#tbody");
  tb.innerHTML = "";

  if (!frozenLayout) computeTimesOnce();
  const simLayout = showSimulation ? computeSimulationLayout() : [];

  tasks.forEach((t,i)=>{
    const tr = document.createElement("tr");
    tr.id = "row-"+t.id;
    tr.className = t.status;

    const lay = frozenLayout.find(x=>x.id===t.id);
    const startStr = lay ? tzFmt.format(new Date(lay.start)) : "-";
    const endStr   = lay ? tzFmt.format(new Date(lay.end))   : "-";

    tr.innerHTML = `
      <td>${i+1}</td>
      <td class="work-col"><input class="work-flag" type="checkbox" ${t.is_work?"checked":""}></td>
      <td><input class="edit-name" type="text" value="${t.name.replace(/"/g,'&quot;')}" ${t.status==="running"?"disabled":""}></td>
      <td><span class="remain">${fmt(t.remaining)}</span></td>
      <td>${startStr}</td>
      <td>${endStr}</td>
      <td><span class="${badgeClass(t.status)}">${t.status}</span></td>
      <td>
        <div class="edit-grid">
          <input class="edit-h" type="number" value="${Math.floor(t.duration/3600)}" ${t.status==="running"?"disabled":""}>:
          <input class="edit-m" type="number" value="${Math.floor((t.duration%3600)/60)}" ${t.status==="running"?"disabled":""}>:
          <input class="edit-s" type="number" value="${t.duration%60}" ${t.status==="running"?"disabled":""}>
          <button onclick="updateTask(${t.id})" ${t.status==="running"?"disabled":""}>עדכן</button>
        </div>
      </td>
      <td>
        <div class="extend-grid">
          <input class="ext-h" type="number" value="0">:
          <input class="ext-m" type="number" value="0">:
          <input class="ext-s" type="number" value="0">
          <button onclick="extendTask(${t.id})">הארך</button>
        </div>
      </td>
      <td>
        <div class="move-grid">
          <input class="move-to" type="number" value="${i+1}">
          <button onclick="moveTask(${t.id})">העבר</button>
        </div>
      </td>
      <td class="row-actions">
        <button onclick="action('/start/${t.id}')">התחל</button>
        <button onclick="action('/pause/${t.id}')">השהה</button>
        <button onclick="action('/reset/${t.id}')">איפוס</button>
        <button onclick="action('/set_pending/${t.id}')">Pending</button>
        <button onclick="action('/skip/${t.id}')">דלג</button>
        <button onclick="action('/done/${t.id}')">Done</button>
        <button onclick="dualResetPending(${t.id})">איפוס+Pending</button>
        <button onclick="action('/delete/${t.id}')">מחק</button>
      </td>
    `;

    tb.appendChild(tr);

    if(showSimulation){
      const sim = simLayout.find(x=>x.id===t.id);
      const simTr = document.createElement("tr");
      simTr.className = "sim-row";
      simTr.innerHTML = `
        <td colspan="11">
          <span class="sim-label">סימולציה</span> –
          התחלה: <b>${sim ? tzFmt.format(new Date(sim.start)) : "-"}</b>,
          סיום: <b>${sim ? tzFmt.format(new Date(sim.end)) : "-"}</b>
        </td>
      `;
      tb.appendChild(simTr);
    }

    tr.querySelectorAll("input").forEach(inp=>{
      inp.addEventListener("focusin", ()=> isTyping = true);
      inp.addEventListener("focusout", ()=> { isTyping = false; syncState(true); });
    });

    tr.querySelector(".work-flag").onchange = async e=>{
      await api(`/workflag/${t.id}`,"POST",{is_work:e.target.checked});
      await syncState(true);
    };
  });

  $("#simStartTime").value = simUserValue;
}

// ---- פעולות ----
async function action(url){
  blockSync = true;
  await api(url,"POST");
  blockSync = false;
  await syncState(true);
}

async function dualResetPending(id){
  blockSync = true;
  await api(`/reset/${id}`,"POST");
  await api(`/set_pending/${id}`,"POST");
  blockSync = false;
  await syncState(true);
}

async function updateTask(id){
  const row = $("#row-"+id);
  const nm = row.querySelector(".edit-name").value;
  const h = parseInt(row.querySelector(".edit-h").value)||0;
  const m = parseInt(row.querySelector(".edit-m").value)||0;
  const s = parseInt(row.querySelector(".edit-s").value)||0;

  await api(`/update/${id}`,"POST",{name:nm, hours:h, minutes:m, seconds:s});
  await syncState(true);
}

async function extendTask(id){
  const row=$("#row-"+id);
  const h=parseInt(row.querySelector(".ext-h").value)||0;
  const m=parseInt(row.querySelector(".ext-m").value)||0;
  const s=parseInt(row.querySelector(".ext-s").value)||0;

  await api(`/extend/${id}`,"POST",{hours:h, minutes:m, seconds:s});
  await syncState(true);
}

async function moveTask(id){
  const row = $("#row-"+id);
  const newPos = parseInt(row.querySelector(".move-to").value)||1;
  await api("/reorder_single","POST",{task_id:id,new_position:newPos});
  await syncState(true);
}

$("#btnAdd").onclick = async ()=>{
  const n=$("#newName").value.trim()||"משימה חדשה";
  const h=parseInt($("#newH").value)||0;
  const m=parseInt($("#newM").value)||0;
  const s=parseInt($("#newS").value)||0;
  const pos=parseInt($("#newPos").value)||1;

  await api("/add","POST",{name:n,hours:h,minutes:m,seconds:s,insert_position:pos});

  $("#newName").value="";
  $("#newH").value=0;
  $("#newM").value=0;
  $("#newS").value=0;
  document.querySelectorAll(".preset").forEach(b=>b.classList.remove("active"));

  await syncState(true);
};

// 🆕 זמנים מהירים – ממלא את שדות הזמן (אפשר עדיין לשנות ידנית)
document.querySelectorAll(".preset").forEach(btn=>{
  btn.onclick = ()=>{
    $("#newH").value = 0;
    $("#newM").value = btn.dataset.min;
    $("#newS").value = 0;
    document.querySelectorAll(".preset").forEach(b=>b.classList.toggle("active", b===btn));
  };
});
["#newH","#newM","#newS"].forEach(sel=>{
  $(sel).addEventListener("input", ()=>
    document.querySelectorAll(".preset").forEach(b=>b.classList.remove("active")));
});

// 🆕 מטלות קבועות – זמן קבוע, רק בוחרים מיקום (ריק = בסוף)
const FIXED_TASKS = [
  { name: "הפסקה",    icon: "☕", minutes: 15 },
  { name: "התארגנות", icon: "🧹", minutes: 15 },
  { name: "אוכל",     icon: "🍽️", minutes: 35 },
];

(function renderFixed(){
  const box = $("#fixedList");
  FIXED_TASKS.forEach((f, i)=>{
    const div = document.createElement("div");
    div.className = "fixed-item";
    div.innerHTML = `
      <div class="title">${f.icon} ${f.name}</div>
      <div class="dur">${f.minutes} דקות</div>
      <div class="row">
        מיקום:
        <input type="number" min="1" placeholder="סוף" id="fixedPos${i}">
        <button id="fixedBtn${i}">➕ הוסף</button>
      </div>`;
    box.appendChild(div);

    div.querySelector(`#fixedBtn${i}`).onclick = async ()=>{
      const inp = $(`#fixedPos${i}`);
      const raw = inp.value.trim();
      const pos = raw === "" ? tasks.length + 1 : (parseInt(raw) || tasks.length + 1);
      await api("/add","POST",{name:f.name,hours:0,minutes:f.minutes,seconds:0,insert_position:pos});
      inp.value = "";
      await syncState(true);
    };
  });
})();

// 🆕 זמן ספייר
let spare = { budget:0, used:0, active:false, startMs:null };

function spareCalc(){
  const live = spare.active && spare.startMs
    ? Math.max(0, Math.floor((nowMs() - spare.startMs)/1000)) : 0;
  const usedNow = spare.used + live;
  return {
    left: Math.max(0, spare.budget - usedNow),
    over: Math.max(0, usedNow - spare.budget),
    usedNow
  };
}

function updateSpare(){
  const c = spareCalc();
  const box = $("#spareBox");
  box.classList.toggle("active", spare.active && c.over === 0);
  box.classList.toggle("over", spare.active && c.over > 0);

  $("#spareClock").textContent = c.over > 0 ? "+" + fmt(c.over) : fmt(c.left);
  const btn = $("#spareBtn");
  btn.textContent = spare.active ? "■ עצור ספייר" : "▶ הפעל ספייר";
  btn.disabled = !spare.active && spare.budget === 0;

  let info = "";
  if (spare.budget === 0) info = "הגדר כמה דקות ספייר יש לך";
  else {
    info = `נוצל ${fmt(c.usedNow)} מתוך ${fmt(spare.budget)}`;
    if (c.over > 0) info += " – חרגת מהספייר";
  }
  $("#spareInfo").innerHTML = info +
    (spare.used > 0 && !spare.active ? ` · <button class="linklike" id="spareRefill">מלא מחדש</button>` : "");
  const rf = $("#spareRefill");
  if (rf) rf.onclick = () => action("/spare/refill");
}

$("#spareBtn").onclick = async ()=>{
  await action(spare.active ? "/spare/stop" : "/spare/start");
};

$("#spareSave").onclick = async ()=>{
  const m = parseFloat($("#spareMin").value) || 0;
  await api("/spare/set","POST",{minutes:m});
  $("#spareSave").blur();
  await syncState(true);
};

$("#btnAllPending").onclick = async ()=>{
  await api("/set_all_pending","POST");
  await syncState(true);
};

// 🆕
$("#btnResetPlan").onclick = async ()=>{
  if (!confirm("לקבוע את שעת הסיום הצפויה כרגע כיעד חדש? (החריגה תתאפס)")) return;
  await api("/reset_plan","POST");
  await syncState(true);
};

$("#btnSimToggle").onclick = ()=>{
  showSimulation = !showSimulation;
  $("#btnSimToggle").textContent = showSimulation ? "הסתר סימולציה" : "הצג סימולציה";
  renderTasks();
};

$("#simStartTime").addEventListener("change", ()=>{
  simUserValue = $("#simStartTime").value;
  localStorage.setItem("simStartTime", simUserValue);
  renderTasks();
});

$("#btnExport").onclick = async ()=>{
  const res = await fetch("/export");
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "tasks_export.json";
  a.click();

  URL.revokeObjectURL(url);
};

$("#fileImport").addEventListener("change", async (ev)=>{
  const file = ev.target.files[0];
  if(!file) return;

  const txt = await file.text();
  try{
    const json = JSON.parse(txt);
    await api("/import", "POST", json);
    await syncState(true);
  }catch{
    alert("קובץ ייבוא לא תקין.");
  }
  ev.target.value = "";
});

// שעונים
setInterval(()=>{
  $("#now").textContent = new Date().toLocaleTimeString("he-IL",{hour12:false});
  updateEndInfo();
  updateSpare();
},1000);

setInterval(()=>{
  if(!blockSync && !isTyping){
    syncState(false);
  }
},2500);

syncState(true);
</script>
</body>
</html>
